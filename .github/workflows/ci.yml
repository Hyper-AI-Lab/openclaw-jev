name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        env:
          # Offline unit suite — no live NVIDIA / Slack / Temporal required.
          RMP_SETTINGS_PATH: ${{ github.workspace }}/settings.example.json
        run: |
          python -m pytest tests/ -q --ignore=tests/integration
