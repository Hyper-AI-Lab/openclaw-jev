name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed OpenClaw/RMP host paths
        run: |
          # Production code hardcodes /root/.openclaw/...; map the checked-out
          # repo there so unit tests can read/write settings + data like on the VPS.
          sudo mkdir -p /root/.openclaw
          sudo ln -sfn "$GITHUB_WORKSPACE" /root/.openclaw/rmp
          sudo mkdir -p \
            /root/.openclaw/agents/main/agent \
            /root/.openclaw/agents/main/sessions \
            /root/.openclaw/workspace \
            /root/.openclaw/cron
          sudo chmod -R a+rwX /root/.openclaw/agents /root/.openclaw/workspace /root/.openclaw/cron
          mkdir -p "$GITHUB_WORKSPACE/data"
          if [[ ! -f "$GITHUB_WORKSPACE/settings.json" ]]; then
            cp "$GITHUB_WORKSPACE/settings.example.json" "$GITHUB_WORKSPACE/settings.json"
          fi

      - name: Unit tests
        run: python -m pytest tests/ -q --ignore=tests/integration
